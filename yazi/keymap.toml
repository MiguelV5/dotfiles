# OVERRIDES:
[[mgr.prepend_keymap]]
on   = [ "<C-c>" ]
run  = "yank"
desc = "Copy selected"

[[mgr.prepend_keymap]]
on   = [ "<C-x>" ]
run  = "yank --cut"
desc = "Cut selected"

[[mgr.prepend_keymap]]
on   = [ "<Esc>" ]
run  = [ "escape --all", "unyank" ]
desc = "Remove all statuses with Esc"

[[mgr.prepend_keymap]]
on   = [ "<C-v>" ]
run  = "paste"
desc = "Paste files"

[[mgr.prepend_keymap]]
on   = [ "<Delete>" ]
run  = "remove --trash"
desc = "Move to trash"

[[mgr.prepend_keymap]]
on   = [ "<C-n>" ]
run  = "create"
desc = "Create a file or directory"



# FROM PLUGINS:
[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on   = "Q"
for  = "unix"
run  = 'shell "$SHELL" --block'
desc = "Open $SHELL here"

[[mgr.prepend_keymap]]
on   = "w"
run  = "plugin toggle-pane min-preview"
desc = "Show or hide the preview pane"
